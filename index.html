<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Eraser Pro (Hapus Objek)</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; max-width: 600px; margin: auto; }
    .card { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
    input[type="file"], input[type="range"], button {
      width: 100%; max-width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: white; font-size: 0.95rem; display: block;
    }
    input[type="file"] { padding: 10px; font-size: 0.85rem; }
    button { background: #3b82f6; border: none; font-weight: bold; cursor: pointer; }
    .green { background: #10b981; }
    .gray { background: #475569; }
    #status { color: #38bdf8; margin-top: 10px; font-size: 0.9rem; font-weight: bold; }
    canvas { max-width: 100%; height: auto; margin-top: 10px; border-radius: 8px; background: #020617; touch-action: none; }
    label { display: block; margin-top: 10px; font-size: 0.85rem; color: #94a3b8; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    .row button { margin-top: 0; }
  </style>
</head>
<body>
  <h2>Magic Eraser Pro</h2>
  <div class="card">
    <input type="file" id="fileInput" accept="image/*" />
    <div id="status">Status: Pilih gambar, lalu usapkan jari pada objek yang ingin dihapus.</div>

    <label>Ukuran Kuas: <span id="brushVal">25</span> px</label>
    <input type="range" id="brushSize" min="5" max="70" value="25" />

    <div class="row">
      <button type="button" class="gray" id="btnUndo">Reset Kuas</button>
      <button type="button" id="btnErase">Hapus Objek Sekarang</button>
    </div>
    <button type="button" id="btnSave" class="green">Simpan Hasil (JPEG 95%)</button>
  </div>

  <div class="card" style="text-align:center;">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const status = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const brushInput = document.getElementById('brushSize');
    const brushVal = document.getElementById('brushVal');

    let baseCanvas = document.createElement('canvas');
    let baseCtx = baseCanvas.getContext('2d');
    let maskCanvas = document.createElement('canvas');
    let maskCtx = maskCanvas.getContext('2d');
    let isLoaded = false;
    let isDrawing = false;

    brushInput.oninput = () => brushVal.textContent = brushInput.value;

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files.item(0);
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          canvas.width = baseCanvas.width = maskCanvas.width = img.width;
          canvas.height = baseCanvas.height = maskCanvas.height = img.height;
          baseCtx.drawImage(img, 0, 0);
          maskCtx.clearRect(0, 0, img.width, img.height);
          isLoaded = true;
          renderView();
          status.textContent = 'Gambar siap! Usap area objek yang ingin dihapus.';
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function renderView() {
      if (!isLoaded) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(baseCanvas, 0, 0);
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.drawImage(maskCanvas, 0, 0);
      ctx.restore();
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches.item(0).clientX : e.clientX;
      const clientY = e.touches ? e.touches.item(0).clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function startPaint(e) {
      if (!isLoaded) return;
      isDrawing = true;
      paint(e);
    }

    function paint(e) {
      if (!isDrawing || !isLoaded) return;
      e.preventDefault();
      const pos = getCoords(e);
      const scaleRatio = canvas.width / canvas.getBoundingClientRect().width;
      const radius = (parseInt(brushInput.value) / 2) * scaleRatio;

      maskCtx.fillStyle = '#ef4444';
      maskCtx.beginPath();
      maskCtx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
      maskCtx.fill();
      renderView();
    }

    function stopPaint() { isDrawing = false; }

    canvas.addEventListener('mousedown', startPaint);
    canvas.addEventListener('mousemove', paint);
    window.addEventListener('mouseup', stopPaint);
    canvas.addEventListener('touchstart', startPaint, { passive: false });
    canvas.addEventListener('touchmove', paint, { passive: false });
    window.addEventListener('touchend', stopPaint);

    document.getElementById('btnUndo').onclick = function() {
      if (!isLoaded) return;
      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
      renderView();
      status.textContent = 'Coretan kuas dibersihkan.';
    };

    // Algoritma Difusi & Tekstur Inpainting (Cepat & Mandiri di Browser HP)
    document.getElementById('btnErase').onclick = function() {
      if (!isLoaded) return alert('Pilih gambar terlebih dahulu!');
      status.textContent = 'Menghapus objek dan menyesuaikan latar belakang...';

      setTimeout(() => {
        const w = baseCanvas.width;
        const h = baseCanvas.height;
        const imgData = baseCtx.getImageData(0, 0, w, h);
        const maskData = maskCtx.getImageData(0, 0, w, h).data;
        const d = imgData.data;

        const isHole = new Uint8Array(w * h);
        let minX = w, minY = h, maxX = 0, maxY = 0, hasMask = false;

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = y * w + x;
            if (maskData[i * 4 + 3] > 20) {
              isHole[i] = 1;
              hasMask = true;
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }

        if (!hasMask) {
          status.textContent = 'Usapkan jari dulu pada objek yang ingin dihapus!';
          return;
        }

        // Perluas batas kotak kerja sedikit di luar area kuas
        minX = Math.max(1, minX - 8);
        minY = Math.max(1, minY - 8);
        maxX = Math.min(w - 2, maxX + 8);
        maxY = Math.min(h - 2, maxY + 8);

        // Iterasi pengisian warna dari tepi luar ke dalam (Harmonic Diffusion)
        const iterations = Math.max(maxX - minX, maxY - minY) * 2;
        for (let iter = 0; iter < iterations; iter++) {
          for (let y = minY; y <= maxY; y++) {
            for (let x = minX; x <= maxX; x++) {
              const i = y * w + x;
              if (isHole[i] === 1) {
                let r = 0, g = 0, b = 0, count = 0;
                const neighbors = [i - 1, i + 1, i - w, i + w, i - w - 1, i - w + 1, i + w - 1, i + w + 1];
                for (let k = 0; k < 8; k++) {
                  const ni = neighbors[k];
                  if (ni >= 0 && ni < w * h) {
                    const weight = (isHole[ni] === 0) ? 3 : 1;
                    r += d[ni * 4] * weight;
                    g += d[ni * 4 + 1] * weight;
                    b += d[ni * 4 + 2] * weight;
                    count += weight;
                  }
                }
                d[i * 4] = r / count;
                d[i * 4 + 1] = g / count;
                d[i * 4 + 2] = b / count;
              }
            }
          }
        }

        // Tambahkan grain/tekstur mikro alami agar tidak terlihat terlalu polos
        for (let y = minY; y <= maxY; y++) {
          for (let x = minX; x <= maxX; x++) {
            const i = y * w + x;
            if (isHole[i] === 1) {
              const noise = (Math.random() - 0.5) * 6;
              d[i * 4] = Math.min(255, Math.max(0, d[i * 4] + noise));
              d[i * 4 + 1] = Math.min(255, Math.max(0, d[i * 4 + 1] + noise));
              d[i * 4 + 2] = Math.min(255, Math.max(0, d[i * 4 + 2] + noise));
            }
          }
        }

        baseCtx.putImageData(imgData, 0, 0);
        maskCtx.clearRect(0, 0, w, h);
        renderView();
        status.textContent = 'Objek berhasil dihapus! Anda bisa mengusap area lain jika perlu.';
      }, 30);
    };

    document.getElementById('btnSave').onclick = function() {
      if (!isLoaded) return;
      const a = document.createElement('a');
      a.download = 'clean-image.jpg';
      a.href = baseCanvas.toDataURL('image/jpeg', 0.95);
      a.click();
    };
  </script>
</body>
</html>
